<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Family - Words</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .main-container {
            width: 98vw;
            height: 98vh;
            position: relative;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .sports-image {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* توقيع الأستاذ علي عسيري في المنتصف تماماً */
        .author-badge {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #ffeb3b;
            padding: 8px 25px;
            font-size: 19px;
            font-weight: bold;
            border-radius: 22px;
            border: 2.5px solid #ffeb3b;
            z-index: 3000;
            pointer-events: none;
            direction: rtl;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        /* أزرار التحكم مع حركة Hover الجميلة */
        .controls-header {
            position: absolute;
            top: 10px;
            right: 4%;
            display: flex;
            gap: 12px;
            z-index: 3000;
        }

        .mode-btn {
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .mode-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .btn-practice { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .btn-test1 { background-color: #ef4444; }
        .btn-test2 { background-color: #f59e0b; }

        @media (max-width: 1024px) {
            .author-badge { font-size: 14px; padding: 6px 15px; top: 6px; }
            .controls-header { gap: 6px; right: 2%; top: 6px; }
            .mode-btn { padding: 6px 10px; font-size: 14px; border-width: 2px; }
        }

        /* الطبقة التفاعلية للشفافيات */
        .hotspots-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.2s, border 0.2s;
        }

        .hotspot:hover {
            background-color: rgba(255, 235, 59, 0.25);
            border: 2px dashed #f59e0b;
        }

        /* نافذة انتهاء التدريب والاختبار */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 6000; display: none;
            justify-content: center; align-items: center;
        }

        .modal-box {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 30px 50px; border-radius: 25px; text-align: center; color: #fff;
            border: 4px solid #ffeb3b; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            animation: popIn 0.4s ease; min-width: 320px; direction: rtl;
        }

        .modal-title { font-size: 30px; font-weight: bold; margin-bottom: 10px; color: #ffeb3b; }
        .modal-subtitle { font-size: 22px; margin-bottom: 25px; font-weight: bold; }
        .modal-ok-btn {
            background: #ffeb3b; color: #000; border: none; padding: 10px 40px;
            font-size: 22px; font-weight: bold; border-radius: 20px; cursor: pointer;
        }

        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* نوافذ الترحيب والاختبارات */
        .test-welcome-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px);
            z-index: 7000; display: none; justify-content: center; align-items: center;
        }

        .test-welcome-card {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            padding: 35px 50px; border-radius: 30px; text-align: center; color: #ffffff;
            border: 4px solid #fde047; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            min-width: 380px; direction: rtl;
        }

        .test-welcome-title { font-size: 34px; font-weight: 800; margin-bottom: 16px; color: #fde047; }
        .test-welcome-desc { font-size: 22px; font-weight: bold; margin-bottom: 30px; color: #ffffff; }

        .start-test-btn {
            background: linear-gradient(135deg, #fde047 0%, #eab308 100%);
            color: #1e1b4b; border: 3px solid #ffffff; padding: 14px 45px;
            font-size: 24px; font-weight: bold; border-radius: 50px; cursor: pointer;
        }

        .test-screen-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
            z-index: 8000; display: none; justify-content: center; align-items: center;
        }

        .test-screen-card {
            width: 96vw; height: 96vh;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 4px solid #fde047; border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 10px 20px; position: relative; direction: rtl;
        }

        .test-question-header {
            width: 100%; text-align: center; background: rgba(255, 255, 255, 0.08);
            padding: 4px 15px; border-radius: 12px; border: 2px solid rgba(253, 224, 71, 0.3);
            position: relative; flex-shrink: 0;
        }

        .test-question-tracker { font-size: 13px; color: #94a3b8; font-weight: bold; margin-bottom: 2px; }
        .test-question-title { font-size: 22px; font-weight: 800; color: #fde047; direction: ltr; display: inline-block; }

        .test-options-grid {
            width: 100%; flex: 1; display: grid;
            grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 10px 0; align-items: center;
        }

        @media (max-width: 900px) {
            .test-options-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .test-option-card {
            background: rgba(255, 255, 255, 0.05); border: 3px solid #38bdf8;
            border-radius: 18px; overflow: hidden; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); height: 100%;
        }

        .test-option-card:hover { transform: translateY(-5px) scale(1.02); border-color: #fde047; }
        .test-option-card img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }

        .test-result-box {
            text-align: center; display: flex; flex-direction: column;
            justify-content: center; align-items: center; height: 100%; width: 100%;
        }

        .test-result-finished-text { font-size: 42px; font-weight: 800; color: #fde047; margin-bottom: 25px; }

        .show-result-btn {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff; border: 3px solid #ffffff; padding: 16px 45px;
            font-size: 28px; font-weight: bold; border-radius: 50px; cursor: pointer;
        }

        .test-final-evaluation {
            font-size: 32px; font-weight: bold; color: #ffffff; margin-top: 15px;
            padding: 12px 30px; border-radius: 20px; background: rgba(255,255,255,0.1); border: 2px solid #fde047;
            text-align: center; line-height: 1.5;
        }

        .test-exit-top-btn {
            position: absolute; top: 5px; left: 10px; background: #ef4444;
            color: #ffffff; border: 2px solid #ffffff; padding: 3px 12px;
            font-size: 13px; font-weight: bold; border-radius: 20px; cursor: pointer;
        }

        /* نافذة تأكيد الخروج */
        .exit-confirm-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px);
            z-index: 9500; display: none; justify-content: center; align-items: center;
        }

        .exit-confirm-card {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            padding: 30px 45px; border-radius: 28px; text-align: center; color: #ffffff;
            border: 4px solid #fde047; min-width: 350px; direction: rtl;
        }

        .exit-confirm-title { font-size: 32px; font-weight: 800; color: #fde047; margin-bottom: 25px; }
        .exit-confirm-btns { display: flex; justify-content: center; gap: 20px; }
        .exit-btn-ok, .exit-btn-cancel {
            border: 2px solid #ffffff; padding: 10px 32px; font-size: 22px; font-weight: bold;
            border-radius: 25px; cursor: pointer; color: #fff;
        }
        .exit-btn-ok { background: #22c55e; }
        .exit-btn-cancel { background: #ef4444; }

        /* تنسيقات اختبار 2 (صور كبيرة جداً وواضحة) */
        .test2-main-layout {
            width: 100%; flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 2px 0; gap: 10px;
        }

        .test2-image-box {
            width: 95%; max-width: 580px; height: 56vh; max-height: 420px;
            background: rgba(255,255,255,0.08); border: 4px solid #38bdf8;
            border-radius: 22px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); flex-shrink: 0;
        }

        .test2-image-box img {
            width: 100%; height: 100%; object-fit: contain; padding: 4px;
        }

        .test2-options-grid-2x2 {
            width: 95%; max-width: 720px; display: grid;
            grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 2px 0;
        }

        .test2-option-card {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            border: 3px solid #fde047; border-radius: 14px; padding: 10px 15px;
            text-align: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex; justify-content: center; align-items: center;
        }

        .test2-option-card:hover {
            transform: translateY(-4px) scale(1.03);
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            border-color: #ffffff;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.6);
        }

        .test2-option-text {
            font-size: 24px; font-weight: 800; color: #ffffff; text-transform: capitalize;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- توقيع المصمم في المنتصف تماماً -->
        <div class="author-badge">تصميم الأستاذ علي عسيري</div>

        <!-- أزرار التحكم -->
        <div class="controls-header">
            <button class="mode-btn btn-practice" onclick="startPracticeMode()">تدريب 🎯</button>
            <button class="mode-btn btn-test1" onclick="startTestMode()">اختبار 📝</button>
            <button class="mode-btn btn-test2" onclick="startTest2Mode()">اختبار2 📝</button>
        </div>

        <!-- الصورة الرئيسية -->
        <img src="myfamilywords.png" alt="My Family Words" class="sports-image" id="sportsImg" onerror="this.src='myfamilywords.png'">

        <!-- الشفافيات للضغط المباشر -->
        <div class="hotspots-overlay">
            <div class="hotspot" style="top: 15.0%; left: 19.5%; width: 22.0%; height: 31.0%;" onclick="handleItemClick('grandpa.mp3', 'grandpa')"></div>
            <div class="hotspot" style="top: 15.0%; left: 66.0%; width: 22.0%; height: 31.0%;" onclick="handleItemClick('grandma.mp3', 'grandma')"></div>
            <div class="hotspot" style="top: 45.0%; left: 20.0%; width: 17.0%; height: 21.0%;" onclick="handleItemClick('dad.mp3', 'dad')"></div>
            <div class="hotspot" style="top: 45.0%; left: 69.5%; width: 17.0%; height: 21.0%;" onclick="handleItemClick('mom.mp3', 'mom')"></div>
            <div class="hotspot" style="top: 67.0%; left: 9.5%; width: 21.0%; height: 28.0%;" onclick="handleItemClick('brother1.mp3', 'brother1')"></div>
            <div class="hotspot" style="top: 64.0%; left: 42.5%; width: 21.0%; height: 28.0%;" onclick="handleItemClick('brother2.mp3', 'brother2')"></div>
            <div class="hotspot" style="top: 67.0%; left: 74.0%; width: 21.0%; height: 28.0%;" onclick="handleItemClick('sister.mp3', 'sister')"></div>
        </div>

        <!-- نافذة انتهاء التدريب -->
        <div id="finishModal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-title">أحسنت يا بطل! 🎉</div>
                <div class="modal-subtitle">لقد أتممت الجولة التدريبية بنجاح 🌟</div>
                <button class="modal-ok-btn" onclick="closeFinishModal()">موافق</button>
            </div>
        </div>

        <!-- نافذة الترحيب المشتركة -->
        <div id="testWelcomeModal" class="test-welcome-overlay">
            <div class="test-welcome-card">
                <div class="test-welcome-title" id="welcomeModalTitle">اختبار العائلة 🏆</div>
                <div class="test-welcome-desc" id="welcomeModalDesc">هل أنت مستعد لاختبار معلوماتك واكتشاف مستوى إتقانك؟</div>
                <button class="start-test-btn" onclick="onStartTestClick()">لنبدأ الاختبار 🚀</button>
            </div>
        </div>

        <!-- شاشة عرض الأسئلة والاختبارات -->
        <div id="testScreenOverlay" class="test-screen-overlay">
            <div class="test-screen-card" id="testScreenCard">
                <div class="test-question-header">
                    <button class="test-exit-top-btn" onclick="openExitConfirmModal()">✖ خروج</button>
                    <div class="test-question-tracker" id="testQuestionTracker">السؤال 1 من 7</div>
                    <div class="test-question-title" id="testQuestionTitle">Grandpa</div>
                </div>
                <div class="test-options-grid" id="testOptionsGrid"></div>
            </div>
        </div>

        <!-- نافذة تأكيد الخروج -->
        <div id="exitConfirmModal" class="exit-confirm-overlay">
            <div class="exit-confirm-card">
                <div class="exit-confirm-title">خروج من الاختبار ⚠️</div>
                <div class="exit-confirm-btns">
                    <button class="exit-btn-ok" onclick="confirmCancelTest()">ok</button>
                    <button class="exit-btn-cancel" onclick="confirmContinueTest()">cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة نظام الحماية -->
    <div id="expiryOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); z-index:99999; justify-content:center; align-items:center;">
        <div style="background:linear-gradient(135deg, #e74c3c, #c0392b); padding:40px; border-radius:20px; text-align:center; color:white; box-shadow:0 10px 30px rgba(0,0,0,0.7); max-width:450px; width:90%; border:4px solid #fff;">
            <h2 style="font-size:30px; margin-bottom:15px; text-shadow:2px 2px 4px rgba(0,0,0,0.4);">رسالة تنبيه</h2>
            <p style="font-size:20px; margin-bottom:25px; font-weight:bold;">تم تعطيل البرنامج</p>
            <button onclick="closeApp()" style="background-color:#2ecc71; color:white; border:2px solid white; padding:10px 30px; font-size:18px; font-weight:bold; border-radius:10px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.3); transition:0.2s;">موافق</button>
        </div>
    </div>

    <script>
        let currentMode = 'normal';
        let currentTargetText = null;
        let practiceQueue = [];
        let testQuestionsQueue = [];
        let testCurrentQuestionIndex = 0;
        let testScore = 0;
        let currentActiveTest = 'test1';
        let isProcessingTestClick = false;
        let currentPlayingAudio = null;

        /* تم توحيد ملف الصوت الخاص بـ brother إلى brother.mp3 */
        const itemsList = [
            { id: 'grandpa', audio: 'grandpa.mp3', testAudio: 'grandpaa.mp3', text: 'grandpa', image: 'grandpa.png' },
            { id: 'grandma', audio: 'grandma.mp3', testAudio: 'grandmaa.mp3', text: 'grandma', image: 'grandma.png' },
            { id: 'dad', audio: 'dad.mp3', testAudio: 'dada.mp3', text: 'dad', image: 'dad.png' },
            { id: 'mom', audio: 'mom.mp3', testAudio: 'moma.mp3', text: 'mom', image: 'mom.png' },
            { id: 'brother1', audio: 'brother.mp3', testAudio: 'brother1a.mp3', text: 'brother', image: 'brother1.png' },
            { id: 'brother2', audio: 'brother.mp3', testAudio: 'brother1a.mp3', text: 'brother', image: 'brother2.png' },
            { id: 'sister', audio: 'sister.mp3', testAudio: 'sistera.mp3', text: 'sister', image: 'sister.png' }
        ];

        /* التحميل المسبق للأصوات بالاسم الموحد */
        const preloadedAudios = {};
        const soundFilesList = [
            'grandpa.mp3', 'grandpaa.mp3',
            'grandma.mp3', 'grandmaa.mp3',
            'dad.mp3', 'dada.mp3',
            'mom.mp3', 'moma.mp3',
            'brother.mp3',
            'sister.mp3', 'sistera.mp3',
            'good.mp3', 'alert.mp3', 'clapping.mp3', 'goodjob.mp3'
        ];

        function preloadAllSounds() {
            soundFilesList.forEach(file => {
                const snd = new Audio(file);
                snd.preload = 'auto';
                preloadedAudios[file] = snd;
            });
        }
        preloadAllSounds();

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function stopCurrentAudio() {
            if (currentPlayingAudio) {
                currentPlayingAudio.pause();
                try {
                    currentPlayingAudio.currentTime = 0;
                } catch(e) {}
                currentPlayingAudio = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function playAudio(filename) {
            stopCurrentAudio();
            let audio = preloadedAudios[filename];
            if (!audio) {
                audio = new Audio(filename);
            }
            audio.currentTime = 0;
            currentPlayingAudio = audio;
            audio.play().catch(() => {});
            return audio;
        }

        function playAudioAsync(filename) {
            return new Promise((resolve) => {
                stopCurrentAudio();
                let audio = preloadedAudios[filename];
                if (!audio) {
                    audio = new Audio(filename);
                }
                audio.currentTime = 0;
                currentPlayingAudio = audio;
                
                audio.onended = () => { currentPlayingAudio = null; resolve(); };
                audio.onerror = () => { currentPlayingAudio = null; resolve(); };
                audio.play().catch(() => { currentPlayingAudio = null; resolve(); });
                
                setTimeout(() => {
                    if (currentPlayingAudio === audio) {
                        currentPlayingAudio = null;
                        resolve();
                    }
                }, 4000);
            });
        }

        function startPracticeMode() {
            currentMode = 'practice';
            practiceQueue = shuffleArray(itemsList);
            nextQuestion();
        }

        function nextQuestion() {
            if (practiceQueue.length > 0) {
                const currentItem = practiceQueue.pop();
                currentTargetText = currentItem.text;
                playAudio(currentItem.testAudio);
            } else {
                showFinishModal();
            }
        }

        function showFinishModal() {
            playAudio('clapping.mp3');
            document.getElementById('finishModal').style.display = 'flex';
        }

        function closeFinishModal() {
            document.getElementById('finishModal').style.display = 'none';
            location.reload();
        }

        function handleItemClick(audioFile, clickedId) {
            if (currentMode === 'normal') {
                playAudio(audioFile);
            } else if (currentMode === 'practice') {
                const clickedItem = itemsList.find(item => item.id === clickedId);
                if (clickedItem && clickedItem.text === currentTargetText) {
                    playAudio('good.mp3');
                    setTimeout(() => { nextQuestion(); }, 1200);
                } else {
                    playAudio('alert.mp3');
                    setTimeout(() => {
                        const currentItemObj = itemsList.find(item => item.text === currentTargetText);
                        if (currentItemObj) playAudio(currentItemObj.testAudio);
                    }, 1200);
                }
            }
        }

        function startTestMode() {
            currentActiveTest = 'test1';
            document.getElementById('welcomeModalTitle').innerText = 'اختبار الكلمات والأسماء 🏆';
            document.getElementById('testWelcomeModal').style.display = 'flex';
        }

        function startTest2Mode() {
            currentActiveTest = 'test2';
            document.getElementById('welcomeModalTitle').innerText = 'اختبار العائلة (2) 🏆';
            document.getElementById('testWelcomeModal').style.display = 'flex';
        }

        function onStartTestClick() {
            document.getElementById('testWelcomeModal').style.display = 'none';
            if (currentActiveTest === 'test1') {
                initTestSession();
            } else {
                initTest2Session();
            }
        }

        function initTestSession() {
            currentMode = 'test';
            testScore = 0;
            testCurrentQuestionIndex = 0;
            isProcessingTestClick = false;
            stopCurrentAudio();
            testQuestionsQueue = shuffleArray(itemsList);

            document.getElementById('testScreenOverlay').style.display = 'flex';
            renderTestQuestion();
        }

        function renderTestQuestion() {
            isProcessingTestClick = false;
            stopCurrentAudio();
            const currentItem = testQuestionsQueue[testCurrentQuestionIndex];
            
            document.getElementById('testQuestionTracker').innerText = `السؤال ${testCurrentQuestionIndex + 1} من ${testQuestionsQueue.length}`;
            document.getElementById('testQuestionTitle').innerText = currentItem.text;

            playAudioAsync(currentItem.testAudio);

            const wrongOptions = itemsList.filter(item => item.text !== currentItem.text);
            const uniqueWrong = [];
            wrongOptions.forEach(opt => {
                if (!uniqueWrong.some(w => w.text === opt.text)) uniqueWrong.push(opt);
            });
            const shuffledWrong = shuffleArray(uniqueWrong).slice(0, 3);
            const fourOptions = shuffleArray([currentItem, ...shuffledWrong]);

            const optionsGrid = document.getElementById('testOptionsGrid');
            optionsGrid.className = 'test-options-grid';
            optionsGrid.innerHTML = '';

            fourOptions.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'test-option-card';
                card.onclick = () => onSelectImageInTest(opt, currentItem.text);

                const img = document.createElement('img');
                img.src = opt.image;
                img.alt = opt.text;
                img.onerror = function() { this.src = 'myfamilywords.png'; };

                card.appendChild(img);
                optionsGrid.appendChild(card);
            });
        }

        function onSelectImageInTest(selectedOption, correctText) {
            if (isProcessingTestClick) return;
            isProcessingTestClick = true;

            const isCorrect = (selectedOption.text === correctText);
            playAudioAsync(selectedOption.testAudio).then(() => {
                selectTestAnswer(isCorrect);
            });
        }

        function initTest2Session() {
            currentMode = 'test';
            testScore = 0;
            testCurrentQuestionIndex = 0;
            isProcessingTestClick = false;
            stopCurrentAudio();
            testQuestionsQueue = shuffleArray(itemsList);

            document.getElementById('testScreenOverlay').style.display = 'flex';
            renderTest2Question();
        }

        function renderTest2Question() {
            isProcessingTestClick = false;
            stopCurrentAudio();
            const currentItem = testQuestionsQueue[testCurrentQuestionIndex];
            
            document.getElementById('testQuestionTracker').innerText = `السؤال ${testCurrentQuestionIndex + 1} من ${testQuestionsQueue.length}`;
            document.getElementById('testQuestionTitle').innerText = "من هذا الشخص في العائلة؟";

            playAudioAsync(currentItem.testAudio);

            const uniqueFamilyNames = [];
            itemsList.forEach(item => {
                if (!uniqueFamilyNames.includes(item.text)) {
                    uniqueFamilyNames.push(item.text);
                }
            });

            const wrongNames = uniqueFamilyNames.filter(name => name !== currentItem.text);
            const shuffledWrongNames = shuffleArray(wrongNames).slice(0, 3);
            const fourNamesOptions = shuffleArray([currentItem.text, ...shuffledWrongNames]);

            const optionsGrid = document.getElementById('testOptionsGrid');
            optionsGrid.className = 'test2-main-layout';
            optionsGrid.innerHTML = '';

            const imgBox = document.createElement('div');
            imgBox.className = 'test2-image-box';
            const img = document.createElement('img');
            img.src = currentItem.image;
            img.alt = currentItem.text;
            img.onerror = function() { this.src = 'myfamilywords.png'; };
            imgBox.appendChild(img);
            optionsGrid.appendChild(imgBox);

            const grid2x2 = document.createElement('div');
            grid2x2.className = 'test2-options-grid-2x2';

            fourNamesOptions.forEach(nameOpt => {
                const optCard = document.createElement('div');
                optCard.className = 'test2-option-card';
                optCard.onclick = () => selectTest2Answer(nameOpt === currentItem.text);

                const textDiv = document.createElement('div');
                textDiv.className = 'test2-option-text';
                textDiv.innerText = nameOpt;

                optCard.appendChild(textDiv);
                grid2x2.appendChild(optCard);
            });

            optionsGrid.appendChild(grid2x2);
        }

        function selectTest2Answer(isCorrect) {
            if (isProcessingTestClick) return;
            isProcessingTestClick = true;

            const audioFile = isCorrect ? 'good.mp3' : 'alert.mp3';
            playAudioAsync(audioFile).then(() => {
                selectTestAnswer(isCorrect);
            });
        }

        function selectTestAnswer(isCorrect) {
            if (isCorrect) testScore++;
            testCurrentQuestionIndex++;

            if (testCurrentQuestionIndex < testQuestionsQueue.length) {
                if (currentActiveTest === 'test1') {
                    renderTestQuestion();
                } else {
                    renderTest2Question();
                }
            } else {
                showTestFinishedScreen();
            }
        }

        function showTestFinishedScreen() {
            stopCurrentAudio();
            const card = document.getElementById('testScreenCard');
            card.innerHTML = `
                <div class="test-result-box">
                    <div class="test-result-finished-text">انتهى الاختبار 🏁</div>
                    <button class="show-result-btn" onclick="revealTestResult()">إظهار النتيجة 📊</button>
                    <div id="evaluationDisplay"></div>
                </div>
            `;
        }

        function revealTestResult() {
            let evalMessage = "";
            let evalAudio = "";

            if (testScore >= 1 && testScore <= 2) {
                evalMessage = "أرجو المحاولة مرة أخرى";
            } else if (testScore >= 3 && testScore <= 5) {
                evalMessage = "جيد جداً";
                evalAudio = "goodjob.mp3";
            } else if (testScore >= 6 && testScore <= 7) {
                evalMessage = "ممتاز رائع مبدع";
                evalAudio = "clapping.mp3";
            }

            if (evalAudio) {
                playAudio(evalAudio);
            }

            let evaluationText = `درجتك: ${testScore} من ${itemsList.length} <br> ${evalMessage}`;
            const evalDiv = document.getElementById('evaluationDisplay');
            evalDiv.className = 'test-final-evaluation';
            evalDiv.innerHTML = evaluationText;

            const btn = document.querySelector('.show-result-btn');
            if(btn) btn.style.display = 'none';

            const closeBtn = document.createElement('button');
            closeBtn.className = 'show-result-btn';
            closeBtn.style.marginTop = '20px';
            closeBtn.style.background = '#ef4444';
            closeBtn.innerText = 'إغلاق الاختبار ✖️';
            closeBtn.onclick = () => {
                document.getElementById('testScreenOverlay').style.display = 'none';
                location.reload();
            };
            evalDiv.appendChild(document.createElement('br'));
            evalDiv.appendChild(closeBtn);
        }

        function openExitConfirmModal() {
            document.getElementById('exitConfirmModal').style.display = 'flex';
        }

        function confirmContinueTest() {
            document.getElementById('exitConfirmModal').style.display = 'none';
        }

        function confirmCancelTest() {
            stopCurrentAudio();
            document.getElementById('exitConfirmModal').style.display = 'none';
            document.getElementById('testScreenOverlay').style.display = 'none';
            location.reload();
        }

        /* نظام الحماية */
        const appExpiryTimestamp = new Date(2026, 11, 31, 0, 0, 0).getTime();

        function checkProgramExpiry() {
            const currentTimeNow = new Date().getTime();
            if (currentTimeNow >= appExpiryTimestamp) {
                document.getElementById('expiryOverlay').style.display = 'flex';
                document.body.style.pointerEvents = 'none';
                document.getElementById('expiryOverlay').style.pointerEvents = 'auto';
            }
        }

        function closeApp() {
            window.close();
            document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:20vh;'>تم إغلاق البرنامج نهائياً.</h1>";
        }

        setInterval(checkProgramExpiry, 1000);
        window.onload = checkProgramExpiry;
    </script>
</body>
</html>
